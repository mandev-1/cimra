name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            configure: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest
            configure: ""
          - name: Linux
            os: ubuntu-24.04
            configure: ""
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl-dev ninja-build

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/Cimra_artefacts/Release/VST3/Cimra.vst3 dist/
          if [ -d build/Cimra_artefacts/Release/AU ]; then cp -R build/Cimra_artefacts/Release/AU/Cimra.component dist/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Cimra-${{ matrix.name }}
          path: dist
